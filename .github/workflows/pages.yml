# Prüft (Typen, Tests) und veröffentlicht FreiHaus über GitHub Pages.
# Ohne VITE_SUPABASE_* läuft die veröffentlichte Seite im DEMO-Modus (Beispieldaten, noindex).
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bauen (Unterpfad /freihaus/)
        run: npm run build
        env:
          VITE_BASE: /freihaus/
      # GitHub Pages kennt keine Weiterleitung auf die Startdatei: 404.html liefert dieselbe App,
      # damit direkte Aufrufe wie /freihaus/suche funktionieren.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
